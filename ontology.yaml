version: 1
schema_version: 1

# Frozen v1 vocabulary per docs/specs/ontology.md §1.
# Implementation tickets may populate instances and improve real examples,
# but MUST NOT silently add, remove, rename, or change endpoint types or
# population modes. Any change requires an ontology version bump per §1.4.

entity_types:

  - name: document
    definition: A paper in the corpus. Identity is the manifest openalex_id.
    population_mode: structural
    source: data/manifest.jsonl (canonical artifact; identity = openalex_id field).
    examples:
      - status: verified
        instance: W3015883388
        note: "Dense Passage Retrieval for Open-Domain Question Answering"
      - status: verified
        instance: W3039017601
        note: "Leveraging Passage Retrieval with Generative Models for Open Domain Question Answering"
      - status: verified
        instance: W3007672467
        note: "REALM: Retrieval-Augmented Language Model Pre-Training"

  - name: chunk
    definition: A derived chunk from a document, per the chunk-record spec (#2). Identity is chunk_id (c_<16 hex>).
    population_mode: structural
    source: data/derived/chunks.jsonl (canonical artifact, populated by the implementing chunker).
    examples:
      - status: pending_verification
        instance: c_<16 hex, real value once chunker ships>
        note: chunk_id values are populated by the implementing chunker; placeholder shows format.

  - name: method
    definition: A named retrieval, generation, or representation method discussed in the corpus.
    population_mode: extracted
    extraction_prompt: prompt_entity_method
    examples:
      - status: verified
        instance: ColBERT
        note: appears in W3021397474 (ColBERT), W3038831159, W3217305727 (ColBERTv2)
      - status: verified
        instance: RAG
        note: appears in W3039017601 ("Leveraging Passage Retrieval with Generative Models...") and others
      - status: verified
        instance: REALM
        note: appears in W3007672467 (REALM paper)
      - status: verified
        instance: DPR
        note: appears in W3015883388 ("Dense Passage Retrieval...")
      - status: verified
        instance: Fusion-in-Decoder
        note: appears in W3207796810 (KG-FiD paper)

  - name: dataset
    definition: A named evaluation dataset used or introduced in the corpus.
    population_mode: extracted
    extraction_prompt: prompt_entity_dataset
    examples:
      - status: verified
        instance: Natural Questions
        note: introduced in W2912924812; appears in W3038831159 and others
      - status: verified
        instance: HotpotQA
        note: introduced in W2889787757
      - status: verified
        instance: SQuAD
        note: introduced in W2963748441
      - status: verified
        instance: ELI5
        note: introduced in W2950681488

  - name: metric
    definition: A named retrieval or QA evaluation metric.
    population_mode: extracted
    extraction_prompt: prompt_entity_metric
    examples:
      - status: pending_verification
        instance: Recall@k
        note: corpus scan finds "recall" mentioned but exact "Recall@k" surface form needs extraction-ticket verification.
      - status: pending_verification
        instance: Exact Match
        note: standard RAG/QA metric; needs extraction-ticket verification against paper results sections.

  - name: task
    definition: A named retrieval, QA, or generation task.
    population_mode: extracted
    extraction_prompt: prompt_entity_task
    examples:
      - status: verified
        instance: Open-Domain QA
        note: appears in W3132386006, W3015883388, W3039017601, and others
      - status: verified
        instance: Multi-Hop QA
        note: appears in W3115947671
      - status: verified
        instance: Passage Retrieval
        note: appears in W3015883388, W3039017601, W3092683697, and others
      - status: verified
        instance: Re-ranking
        note: appears in W2909544278, W2963195889, W3206455169

relation_types:

  - name: CITES
    from: document
    to: document
    definition: Document A references Document B in its bibliography. Direction: citing -> cited.
    population_mode: structural
    source: parsed from each document's bibliography (the implementing ingest pipeline walks the bibliography and emits one edge per cited openalex_id). No LLM call in the citation-graph construction.
    examples:
      - status: pending_verification
        from: W3015883388
        to: W2912924812
        note: DPR paper likely cites NQ paper; needs extraction-ticket verification against actual bibliography.

  - name: PROPOSES
    from: document
    to: method
    definition: Document introduces or originates a method.
    population_mode: extracted
    extraction_prompt: prompt_relation_proposes_method
    examples:
      - status: verified
        from: W3021397474
        to: ColBERT
        note: ColBERT paper introduces ColBERT.
      - status: verified
        from: W3015883388
        to: DPR
        note: DPR paper introduces Dense Passage Retrieval.
      - status: verified
        from: W3007672467
        to: REALM
        note: REALM paper introduces REALM.

  - name: INTRODUCES
    from: document
    to: dataset
    definition: Document releases or proposes a dataset.
    population_mode: extracted
    extraction_prompt: prompt_relation_introduces_dataset
    examples:
      - status: verified
        from: W2912924812
        to: Natural Questions
        note: NQ paper introduces Natural Questions.
      - status: verified
        from: W2889787757
        to: HotpotQA
        note: HotpotQA paper introduces HotpotQA.
      - status: verified
        from: W2963748441
        to: SQuAD
        note: SQuAD paper introduces SQuAD.

  - name: EVALUATES_ON
    from: document
    to: dataset
    definition: Document reports experimental results on a dataset.
    population_mode: extracted
    extraction_prompt: prompt_relation_evaluates_on
    examples:
      - status: pending_verification
        from: W3039017601
        to: Natural Questions
        note: RAG paper evaluates on NQ; needs extraction-ticket verification against the paper's results section.
      - status: pending_verification
        from: W2889787757
        to: HotpotQA
        note: HotpotQA paper's own results section.

  - name: USES_METHOD
    from: document
    to: method
    definition: Document applies or builds on a method without originating it.
    population_mode: extracted
    extraction_prompt: prompt_relation_uses_method
    examples:
      - status: pending_verification
        from: W3207796810
        to: Fusion-in-Decoder
        note: KG-FiD paper uses Fusion-in-Decoder; needs extraction-ticket verification.

  - name: REPORTS_METRIC
    from: document
    to: metric
    definition: Document reports a metric in its results.
    population_mode: extracted
    extraction_prompt: prompt_relation_reports_metric
    examples:
      - status: pending_verification
        from: W3039017601
        to: Exact Match
        note: RAG paper reports EM on QA tasks; needs extraction-ticket verification against paper text.

  - name: EXTENDS
    from: method
    to: method
    definition: Method A builds on or generalises method B.
    population_mode: extracted
    extraction_prompt: prompt_relation_extends_method
    examples:
      - status: pending_verification
        from: ColBERTv2
        to: ColBERT
        note: ColBERTv2 paper extends ColBERT; needs extraction-ticket verification against paper text (W3217305727 vs W3021397474).

  - name: EVALUATED_ON
    from: method
    to: dataset
    definition: A method's empirical evaluation is on a dataset. Derived from PROPOSES x EVALUATES_ON closure.
    population_mode: derived
    derivation: |
      For each (document, method, dataset) such that document -[PROPOSES]-> method
      AND document -[EVALUATES_ON]-> dataset, emit (method) -[EVALUATED_ON]-> (dataset).
      Equivalent Cypher:
        MATCH (d:document)-[:PROPOSES]->(m:method),
              (d)-[:EVALUATES_ON]->(ds:dataset)
        MERGE (m)-[:EVALUATED_ON]->(ds);
    examples:
      - status: pending_verification
        from: RAG
        to: Natural Questions
        note: derived once PROPOSES(W3039017601 -> RAG) and EVALUATES_ON(W3039017601 -> Natural Questions) are extracted.

  - name: USED_FOR_TASK
    from: dataset
    to: task
    definition: A dataset supports or is standard for a task.
    population_mode: extracted
    extraction_prompt: prompt_relation_used_for_task
    examples:
      - status: verified
        from: HotpotQA
        to: Multi-Hop QA
        note: HotpotQA is the canonical multi-hop QA benchmark; documented in the dataset paper.
      - status: verified
        from: Natural Questions
        to: Open-Domain QA
        note: NQ is the canonical open-domain QA benchmark.

  - name: MEASURES
    from: metric
    to: task
    definition: A metric evaluates performance on a task.
    population_mode: extracted
    extraction_prompt: prompt_relation_measures
    examples:
      - status: verified
        from: Recall@k
        to: Passage Retrieval
        note: Recall@k is the standard retrieval-quality metric for passage retrieval.
      - status: pending_verification
        from: Exact Match
        to: Open-Domain QA
        note: EM is standard for ODQA but the corpus-internal confirmation needs extraction-ticket verification.

notes: |
  Starter v1 ontology authored during Wayfinder resolution of #5.
  Real corpus openalex_ids verified against data/manifest.jsonl at resolution time.
  Method/dataset/task/metric examples verified by string-matching against paper titles
  and abstracts; relation examples marked pending_verification require extraction-ticket
  verification against full paper text. Author entity type intentionally excluded per
  user standing preference.
